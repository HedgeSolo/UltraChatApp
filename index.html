<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UltraChatApp 3000</title>
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* Discord-style CSS Base */
        :root {
            --bg-primary: #36393f;
            --bg-secondary: #2f3136;
            --bg-tertiary: #202225;
            --text-normal: #dcddde;
            --text-muted: #72767d;
            --brand-color: #5865F2;
            --danger: #ed4245;
            --success: #3ba55d;
        }
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-normal);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        
        /* Layout */
        #server-sidebar { width: 72px; background: var(--bg-tertiary); display: flex; flex-direction: column; align-items: center; padding: 12px 0; gap: 8px; overflow-y: auto; }
        #channel-sidebar { width: 240px; background: var(--bg-secondary); display: flex; flex-direction: column; }
        #main-chat { flex: 1; display: flex; flex-direction: column; background: var(--bg-primary); }
        #member-sidebar { width: 240px; background: var(--bg-secondary); padding: 16px; overflow-y: auto; display: none; }

        /* Server Icons */
        .server-icon {
            width: 48px; height: 48px; border-radius: 50%;
            background: var(--bg-primary); display: flex; justify-content: center; align-items: center;
            cursor: pointer; transition: 0.2s; overflow: hidden; font-weight: bold;
        }
        .server-icon img { width: 100%; height: 100%; object-fit: cover; }
        .server-icon:hover { border-radius: 16px; background: var(--brand-color); }
        
        /* Modals & UI */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: var(--bg-primary); padding: 24px; border-radius: 8px; width: 400px; }
        .modal-content input[type="text"], .modal-content input[type="file"] { width: 90%; padding: 10px; margin: 10px 0; background: var(--bg-tertiary); border: none; color: white; border-radius: 4px; }
        .modal-content button { background: var(--brand-color); color: white; border: none; padding: 10px 16px; border-radius: 4px; cursor: pointer; }
        
        /* Hidden Auth UI */
        #auth-view { position: absolute; inset: 0; background: var(--bg-primary); display: flex; justify-content: center; align-items: center; z-index: 9999; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- Auth View -->
    <div id="auth-view">
        <div class="modal-content" style="text-align: center;">
            <h2>Welcome to UltraChatApp 3000</h2>
            <input type="text" id="auth-email" placeholder="Email (e.g., ld0113@ncmcs.net)">
            <input type="password" id="auth-pass" placeholder="Password">
            <button onclick="handleLogin()">Login</button>
            <button onclick="handleSignup()" style="background: var(--text-muted);">Sign Up</button>
        </div>
    </div>

    <!-- Main App -->
    <div id="app-view" class="hidden" style="width: 100%; height: 100%; display: flex;">
        
        <!-- Server Sidebar -->
        <div id="server-sidebar">
            <div class="server-icon" onclick="loadHome()" title="Home (DMs & Friends)">🏠</div>
            <div style="width: 32px; height: 2px; background: var(--bg-primary); border-radius: 2px;"></div>
            <div id="server-list" style="display:flex; flex-direction:column; gap:8px;"></div>
            <div class="server-icon" onclick="document.getElementById('createServerModal').style.display='flex'" style="color: var(--success); background: var(--bg-primary);">+</div>
        </div>

        <!-- Channel Sidebar -->
        <div id="channel-sidebar">
            <div id="server-header" style="padding: 16px; font-weight: bold; border-bottom: 1px solid var(--bg-tertiary); cursor: pointer;" onclick="openServerSettings()">
                Loading...
            </div>
            <div id="channel-list" style="padding: 12px; flex: 1; overflow-y: auto;"></div>
            
            <!-- User Controls -->
            <div style="background: var(--bg-tertiary); padding: 12px; display: flex; align-items: center; gap: 10px;">
                <img id="current-user-avatar" src="" style="width: 32px; height: 32px; border-radius: 50%; background: #000; object-fit: cover;">
                <div style="flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">
                    <strong id="current-user-name">User</strong>
                </div>
                <button onclick="logout()" style="background: transparent; border: none; color: var(--danger); cursor: pointer;">⚙️</button>
            </div>
        </div>

        <!-- Main Chat -->
        <div id="main-chat">
            <div id="chat-header" style="padding: 16px; font-weight: bold; border-bottom: 1px solid var(--bg-tertiary); display: flex; justify-content: space-between;">
                <span id="chat-title"># general</span>
                <button onclick="toggleMemberList()" style="background: transparent; border: none; color: var(--text-normal); cursor: pointer;">👥</button>
            </div>
            <div id="message-list" style="flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px;">
                <!-- Messages populate here -->
            </div>
            <div style="padding: 16px;">
                <input type="text" id="message-input" placeholder="Message..." style="width: 100%; padding: 14px; border-radius: 8px; border: none; background: var(--bg-tertiary); color: white; box-sizing: border-box;" onkeypress="if(event.key === 'Enter') sendMessage()">
            </div>
        </div>

        <!-- Member Sidebar -->
        <div id="member-sidebar">
            <h3 style="font-size: 12px; text-transform: uppercase; color: var(--text-muted);">Members</h3>
            <div id="member-list-content"></div>
        </div>

    </div>

    <!-- Create Server Modal -->
    <div id="createServerModal" class="modal">
        <div class="modal-content">
            <h3>Create a Server</h3>
            <p style="font-size: 14px; color: var(--text-muted);">Give your new server a personality with a name and an icon.</p>
            <input type="text" id="new-server-name" placeholder="Server Name">
            
            <label style="font-size: 12px; color: var(--text-muted); margin-top: 10px; display: block;">Server Icon (Optional)</label>
            <input type="file" id="new-server-icon" accept="image/*">
            
            <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px;">
                <button onclick="document.getElementById('createServerModal').style.display='none'" style="background: transparent; color: white;">Cancel</button>
                <button onclick="createServer()">Create</button>
            </div>
        </div>
    </div>

    <script>
        // Initialize Supabase (Replace with your actual keys)
        const supabaseUrl = 'YOUR_SUPABASE_URL';
        const supabaseKey = 'YOUR_SUPABASE_ANON_KEY';
        const supabase = supabase.createClient(supabaseUrl, supabaseKey);

        let currentUser = null;
        let currentServer = null;
        let currentChannel = null;

        // --- Core Utility: File to Base64 ---
        const fileToBase64 = (file) => new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result);
            reader.onerror = error => reject(error);
        });

        // --- Auth & Init ---
        async function checkAuth() {
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                currentUser = session.user;
                document.getElementById('auth-view').classList.add('hidden');
                document.getElementById('app-view').classList.remove('hidden');
                initApp();
            } else {
                document.getElementById('auth-view').classList.remove('hidden');
                document.getElementById('app-view').classList.add('hidden');
            }
        }

        async function handleLogin() {
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-pass').value;
            const { error } = await supabase.auth.signInWithPassword({ email, password });
            if (error) alert(error.message);
            else checkAuth();
        }

        async function handleSignup() {
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-pass').value;
            const { error } = await supabase.auth.signUp({ email, password });
            if (error) alert(error.message);
            else checkAuth();
        }

        async function logout() {
            await supabase.auth.signOut();
            window.location.reload();
        }

        // --- App Initialization ---
        async function initApp() {
            // Load Profile
            const { data: profile } = await supabase.from('profiles').select('*').eq('id', currentUser.id).single();
            document.getElementById('current-user-name').innerText = profile?.display_name || currentUser.email.split('@')[0];
            if (profile?.avatar_url) document.getElementById('current-user-avatar').src = profile.avatar_url;

            loadServers();
        }

        // --- Servers & Images ---
        async function loadServers() {
            const { data: servers } = await supabase.from('servers').select('*');
            const serverList = document.getElementById('server-list');
            serverList.innerHTML = '';
            
            servers.forEach(server => {
                const div = document.createElement('div');
                div.className = 'server-icon';
                div.title = server.name;
                div.onclick = () => loadChannels(server);
                
                // THE FIX: Check if icon exists and render image, else render initials
                if (server.icon && server.icon.startsWith('data:image')) {
                    div.innerHTML = `<img src="${server.icon}" alt="${server.name}">`;
                } else {
                    div.innerText = server.name.charAt(0).toUpperCase();
                }
                
                serverList.appendChild(div);
            });
        }

        async function createServer() {
            const name = document.getElementById('new-server-name').value;
            const fileInput = document.getElementById('new-server-icon');
            let iconBase64 = null;

            if (!name) return alert("Server needs a name!");

            // THE FIX: Convert uploaded image to Base64
            if (fileInput.files.length > 0) {
                iconBase64 = await fileToBase64(fileInput.files[0]);
            }

            const { data, error } = await supabase.from('servers').insert([{ 
                id: 'srv_' + Date.now(),
                name: name, 
                owner_id: currentUser.id,
                icon: iconBase64 // Saves directly to DB
            }]);

            if (error) {
                alert(error.message);
            } else {
                document.getElementById('createServerModal').style.display = 'none';
                document.getElementById('new-server-name').value = '';
                document.getElementById('new-server-icon').value = '';
                loadServers();
            }
        }

        function toggleMemberList() {
            const sidebar = document.getElementById('member-sidebar');
            sidebar.style.display = sidebar.style.display === 'none' || sidebar.style.display === '' ? 'block' : 'none';
        }

        // Initialize on load
        checkAuth();
    </script>
</body>
</html>
