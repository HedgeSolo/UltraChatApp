<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Supabase Guestbook</title>
  <!-- Loaded the full Supabase JS v2 library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: sans-serif; max-width: 500px; margin: 50px auto; padding: 20px; }
    form { display: flex; gap: 10px; margin-bottom: 20px; }
    input { flex: 1; padding: 8px; }
    button { padding: 8px 16px; }
    .message { background: #f4f4f4; padding: 10px; margin-bottom: 10px; border-radius: 4px; }
  </style>
</head>
<body>

  <h2>Send a Message</h2>
  <form id="messageForm">
    <input type="text" id="messageInput" placeholder="Type a message..." required />
    <button type="submit">Send</button>
  </form>

  <h2>Saved Messages</h2>
  <div id="messagesList">Loading messages...</div>

  <script>
    const SUPABASE_URL = "https://unjvzzlwxpmiqyrovbce.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVuanZ6emx3eHBtaXF5cm92YmNlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMyODE1MDAsImV4cCI6MjEwODg1NzUwMH0.WKKvm2xkIJf8nJLy8eV4ndQZ7LF1qp5ExHGX6LL3a_A";
    
    const { createClient } = supabase;
    const client = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const form = document.getElementById('messageForm');
    const input = document.getElementById('messageInput');
    const list = document.getElementById('messagesList');

    async function fetchMessages() {
      const { data, error } = await client
        .from('messages')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) {
        console.error('Error fetching:', error);
        list.innerHTML = 'Error loading messages.';
        return;
      }

      if (!data || data.length === 0) {
        list.innerHTML = 'No messages yet.';
        return;
      }

      list.innerHTML = data.map(msg => `
        <div class="message">
          <strong>${msg.user_name || 'Anonymous'}:</strong> ${msg.text}
        </div>
      `).join('');
    }

    // Added event listener to capture form submit & insert message to database
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const messageText = input.value.trim();
      if (!messageText) return;

      const { error } = await client
        .from('messages')
        .insert([{ text: messageText }]);

      if (error) {
        console.error('Error inserting message:', error);
        alert('Failed to send message.');
        return;
      }

      input.value = '';
      fetchMessages();
    });

    fetchMessages();
  </script>
</body>
</html>
