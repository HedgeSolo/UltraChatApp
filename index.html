<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Supabase Guestbook</title>
  <!-- Load the Supabase JS Library from a CDN -->
  <script src="https://jsdelivr.net"></script>
  <style>
    body { font-family: sans-serif; max-width: 500px; margin: 50px auto; padding: 20px; }
    form { display: flex; gap: 10px; margin-bottom: 20px; }
    input { flex: 1; padding: 8px; }
    button { padding: 8px 16px; }
    .message { background: #f4f4f4; padding: 10px; margin-bottom: 10px; border-radius: 4px; }
  </style>
</head>
<body>

  <h2>Send a Message</h2>
  <form id="messageForm">
    <input type="text" id="messageInput" placeholder="Type a message..." required />
    <button type="submit">Send</button>
  </form>

  <h2>Saved Messages</h2>
  <div id="messagesList">Loading messages...</div>

  <script>
    // 1. Initialize Supabase (Replace with your actual keys)
    const SUPABASE_URL = "https://unjvzzlwxpmiqyrovbce.supabase.co/rest/v1/";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVuanZ6emx3eHBtaXF5cm92YmNlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMyODE1MDAsImV4cCI6MjEwODg1NzUwMH0.WKKvm2xkIJf8nJLy8eV4ndQZ7LF1qp5ExHGX6LL3a_A";
    const supabase = Supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const form = document.getElementById('messageForm');
    const input = document.getElementById('messageInput');
    const list = document.getElementById('messagesList');

    // 2. Fetch and display messages from the database
    async function fetchMessages() {
      const { data, error } = await supabase
        .from('messages')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) {
        console.error('Error fetching:', error);
        return;
      }

      list.innerHTML = data.map(msg => `
        <div class="message">
          <strong>${msg.user_name}:</strong> ${msg.text}
        </div>
      `).join('') || '<p>No messages yet!</p>';
    }

    // 3. Save a new message to the database when submitting the form
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const text = input.value;

      const { error } = await supabase
        .from('messages')
        .insert([{ text: text }]);

      if (error) {
        console.error('Error saving:', error);
      } else {
        input.value = ''; // Clear input
        fetchMessages();   // Refresh the list
      }
    });

    // Load messages immediately when page opens
    fetchMessages();
  </script>
</body>
</html>
