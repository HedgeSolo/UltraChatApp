<!DOCTYPE=html>

<style>
        .custom-button {
            background-color: #007BFF; /* Blue background */
            color: white;              /* White text */
            padding: 10px 20px;        /* Spacing inside the button */
            font-size: 16px;           /* Text size */
            border: none;              /* Removes default border */
            border-radius: 5px;        /* Rounds the corners */
            cursor: pointer;           /* Changes mouse cursor to a hand */
            transition: 0.3s;          /* Smooth hover effect transition */
        }

        /* Hover effect when the mouse moves over the button */
        .custom-button:hover {
            background-color: #0056b3; /* Darker blue */
        }
    </style>

<body>

  <title>ChatApp 3000</title>

  <h1>Ultimate Chat App</h1>
  <p>Welcome. This is a WIP!</p>
  <button type="button" class="custom-button">Styled Button</button>
  
</body>
