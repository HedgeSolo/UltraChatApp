<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UltraChatApp 3000 - Discord Clone</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            discord: {
              serverbar: '#1e1f22',
              sidebar: '#2b2d31',
              chat: '#313338',
              black: '#111214',
              blurple: '#5865f2',
              blurpleHover: '#4752c4',
              green: '#23a55a',
              textMuted: '#949ba4',
              textHeader: '#f2f3f5',
              hover: '#35373c',
              active: '#404249',
              input: '#383a40',
              modifierHover: 'rgba(78, 80, 88, 0.32)'
            }
          }
        }
      }
    };
  </script>

  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <!-- Supabase JS Library v2 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    /* Custom Scrollbar Styling (Discord style) */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #2b2d31;
    }
    ::-webkit-scrollbar-thumb {
      background: #1a1b1e;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #111214;
    }

    /* Voice speaking ring animation */
    @keyframes speaking-ring {
      0% { box-shadow: 0 0 0 0 rgba(35, 165, 90, 0.7); }
      70% { box-shadow: 0 0 0 6px rgba(35, 165, 90, 0); }
      100% { box-shadow: 0 0 0 0 rgba(35, 165, 90, 0); }
    }
    .speaking {
      animation: speaking-ring 1.5s infinite;
    }

    /* Server Icon active indicator pill */
    .server-pill {
      transition: height 0.2s ease, top 0.2s ease;
    }

    /* Theme Variations */
    body.theme-amoled {
      --bg-serverbar: #000000;
      --bg-sidebar: #09090b;
      --bg-chat: #121215;
    }
    body.theme-amoled .bg-discord-serverbar { background-color: #000000 !important; }
    body.theme-amoled .bg-discord-sidebar { background-color: #09090b !important; }
    body.theme-amoled .bg-discord-chat { background-color: #121215 !important; }

    body.theme-light {
      --bg-serverbar: #e3e5e8;
      --bg-sidebar: #f2f3f5;
      --bg-chat: #ffffff;
    }
    body.theme-light .bg-discord-serverbar { background-color: #e3e5e8 !important; }
    body.theme-light .bg-discord-sidebar { background-color: #f2f3f5 !important; }
    body.theme-light .bg-discord-chat { background-color: #ffffff !important; color: #2e3338 !important; }
    body.theme-light .text-discord-textHeader { color: #060607 !important; }
    body.theme-light .text-discord-textMuted { color: #4f5660 !important; }
    body.theme-light .bg-discord-input { background-color: #ebedef !important; color: #060607 !important; }

    body.theme-retro {
      font-family: 'Courier New', Courier, monospace !important;
    }
    body.theme-retro .bg-discord-serverbar { background-color: #000080 !important; }
    body.theme-retro .bg-discord-sidebar { background-color: #1084d0 !important; }
    body.theme-retro .bg-discord-chat { background-color: #c0c0c0 !important; color: #000000 !important; }
  </style>
</head>
<body class="h-full bg-discord-chat text-gray-200 select-none overflow-hidden font-sans">

  <!-- Toast Notification Container -->
  <div id="toastContainer" class="fixed top-4 right-4 z-50 flex flex-col space-y-2 pointer-events-none"></div>

  <!-- APP ROOT WRAPPER -->
  <div id="app" class="flex h-full w-full overflow-hidden">

    <!-- 1. LEFT RAIL: SERVER LIST -->
    <nav class="w-[72px] bg-discord-serverbar flex flex-col items-center py-3 space-y-2 flex-shrink-0 z-20">
      
      <!-- Direct Messages / Home Button -->
      <div class="relative group flex items-center justify-center w-full">
        <div id="homePill" class="server-pill absolute left-0 w-1 bg-white rounded-r h-0 group-hover:h-5 transition-all"></div>
        <button onclick="switchServer('home')" id="btnHomeServer" class="w-12 h-12 rounded-[24px] hover:rounded-[16px] bg-discord-sidebar hover:bg-discord-blurple flex items-center justify-center text-white transition-all duration-200 group">
          <i class="fa-brands fa-discord text-2xl"></i>
        </button>
        <div class="absolute left-[80px] bg-discord-black text-white text-xs px-2.5 py-1.5 rounded-md font-semibold shadow-lg opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none whitespace-nowrap z-50">
          Direct Messages
        </div>
      </div>

      <div class="w-8 h-[2px] bg-discord-sidebar rounded my-1"></div>

      <!-- Scrollable Server List -->
      <div id="serverListContainer" class="flex-1 w-full flex flex-col items-center space-y-2 overflow-y-auto no-scrollbar">
        <!-- Rendered via JS -->
      </div>

      <div class="w-8 h-[2px] bg-discord-sidebar rounded my-1"></div>

      <!-- Add Server Button -->
      <div class="relative group flex items-center justify-center w-full">
        <button onclick="openModal('createServerModal')" class="w-12 h-12 rounded-[24px] hover:rounded-[16px] bg-discord-sidebar hover:bg-discord-green flex items-center justify-center text-discord-green hover:text-white transition-all duration-200">
          <i class="fa-solid fa-plus text-lg"></i>
        </button>
        <div class="absolute left-[80px] bg-discord-black text-white text-xs px-2.5 py-1.5 rounded-md font-semibold shadow-lg opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none whitespace-nowrap z-50">
          Add a Server
        </div>
      </div>

      <!-- Discover Public Servers Button -->
      <div class="relative group flex items-center justify-center w-full">
        <button onclick="openModal('discoverModal')" class="w-12 h-12 rounded-[24px] hover:rounded-[16px] bg-discord-sidebar hover:bg-discord-green flex items-center justify-center text-discord-green hover:text-white transition-all duration-200">
          <i class="fa-solid fa-compass text-lg"></i>
        </button>
        <div class="absolute left-[80px] bg-discord-black text-white text-xs px-2.5 py-1.5 rounded-md font-semibold shadow-lg opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none whitespace-nowrap z-50">
          Explore Public Servers
        </div>
      </div>

    </nav>

    <!-- 2. SECOND SIDEBAR: CHANNELS & USER BAR -->
    <aside class="w-60 bg-discord-sidebar flex flex-col flex-shrink-0 z-10">
      
      <!-- Server Header / Dropdown -->
      <div id="sidebarHeader" class="h-12 border-b border-discord-black/40 px-4 flex items-center justify-between font-bold text-discord-textHeader shadow-sm cursor-pointer hover:bg-discord-hover/50 transition-colors relative" onclick="toggleServerMenu(event)">
        <span id="serverTitleText" class="truncate">UltraChat HQ</span>
        <i id="serverMenuIcon" class="fa-solid fa-chevron-down text-xs text-discord-textMuted transition-transform"></i>

        <!-- Server Settings Dropdown Menu -->
        <div id="serverDropdownMenu" class="hidden absolute top-14 left-2 right-2 bg-discord-black border border-discord-hover/50 rounded-lg p-1.5 shadow-xl z-50 text-sm font-normal">
          <button onclick="openModal('createChannelModal')" class="w-full text-left px-2.5 py-2 hover:bg-discord-blurple hover:text-white rounded flex items-center justify-between text-discord-textHeader">
            <span>Create Channel</span>
            <i class="fa-solid fa-plus-circle text-xs"></i>
          </button>
          <div class="h-[1px] bg-discord-hover my-1"></div>
          <button onclick="leaveCurrentServer()" class="w-full text-left px-2.5 py-2 hover:bg-red-600 hover:text-white rounded flex items-center justify-between text-red-400">
            <span>Leave Server</span>
            <i class="fa-solid fa-right-from-bracket text-xs"></i>
          </button>
        </div>
      </div>

      <!-- Channels List / Direct Messages List -->
      <div id="channelsContainer" class="flex-1 overflow-y-auto p-2 space-y-4">
        <!-- Text Channels Section -->
        <div id="textChannelsGroup">
          <div class="flex items-center justify-between px-2 text-xs font-bold text-discord-textMuted uppercase tracking-wider mb-1 group">
            <span class="flex items-center space-x-1 cursor-pointer" onclick="toggleCategory('textChannelsList')">
              <i id="textCatChevron" class="fa-solid fa-chevron-down text-[10px] mr-1"></i>
              Text Channels
            </span>
            <i onclick="openModal('createChannelModal')" class="fa-solid fa-plus text-xs hover:text-white cursor-pointer opacity-0 group-hover:opacity-100 transition-opacity"></i>
          </div>
          <div id="textChannelsList" class="space-y-0.5">
            <!-- Rendered dynamically -->
          </div>
        </div>

        <!-- Voice Channels Section -->
        <div id="voiceChannelsGroup">
          <div class="flex items-center justify-between px-2 text-xs font-bold text-discord-textMuted uppercase tracking-wider mb-1 group">
            <span class="flex items-center space-x-1 cursor-pointer" onclick="toggleCategory('voiceChannelsList')">
              <i id="voiceCatChevron" class="fa-solid fa-chevron-down text-[10px] mr-1"></i>
              Voice Channels
            </span>
            <i onclick="openModal('createChannelModal')" class="fa-solid fa-plus text-xs hover:text-white cursor-pointer opacity-0 group-hover:opacity-100 transition-opacity"></i>
          </div>
          <div id="voiceChannelsList" class="space-y-0.5">
            <!-- Rendered dynamically -->
          </div>
        </div>
      </div>

      <!-- Voice Connected Status Widget (Appears when in Voice) -->
      <div id="voiceStatusWidget" class="hidden bg-discord-black/60 border-t border-discord-black/40 p-2 flex items-center justify-between">
        <div class="flex items-center space-x-2 overflow-hidden">
          <i class="fa-solid fa-signal text-discord-green text-sm"></i>
          <div class="text-xs truncate">
            <div class="text-discord-green font-semibold">Voice Connected</div>
            <div id="voiceConnectedName" class="text-discord-textMuted truncate"># Voice General</div>
          </div>
        </div>
        <button onclick="disconnectVoice()" class="text-gray-400 hover:text-red-500 p-1 rounded transition-colors" title="Disconnect">
          <i class="fa-solid fa-phone-slash"></i>
        </button>
      </div>

      <!-- Bottom User Control Bar -->
      <div class="h-14 bg-discord-serverbar/90 px-2 flex items-center justify-between flex-shrink-0">
        <div onclick="openModal('userSettingsModal')" class="flex items-center space-x-2 p-1 rounded-md hover:bg-discord-hover/60 cursor-pointer flex-1 min-w-0 mr-1">
          <div class="relative">
            <img id="userBarAvatar" src="https://placehold.co/80x80/5865f2/ffffff?text=User" class="w-8 h-8 rounded-full object-cover" onerror="this.src='https://placehold.co/80x80/5865f2/ffffff?text=User'" />
            <div id="userBarStatusDot" class="absolute -bottom-0.5 -right-0.5 w-3 h-3 rounded-full bg-discord-green border-2 border-discord-serverbar"></div>
          </div>
          <div class="min-w-0 flex-1">
            <div id="userBarName" class="text-xs font-bold text-discord-textHeader truncate">Guest User</div>
            <div id="userBarCustomStatus" class="text-[10px] text-discord-textMuted truncate">Online</div>
          </div>
        </div>
        
        <!-- User Controls Buttons -->
        <div class="flex items-center text-discord-textMuted space-x-1">
          <button id="micBtn" onclick="toggleMute()" class="p-1.5 hover:bg-discord-hover hover:text-white rounded transition-colors" title="Toggle Mute">
            <i class="fa-solid fa-microphone text-xs"></i>
          </button>
          <button id="deafenBtn" onclick="toggleDeafen()" class="p-1.5 hover:bg-discord-hover hover:text-white rounded transition-colors" title="Toggle Deafen">
            <i class="fa-solid fa-headphones text-xs"></i>
          </button>
          <button onclick="openModal('authModal')" class="p-1.5 hover:bg-discord-hover hover:text-white rounded transition-colors" title="Account / Auth">
            <i class="fa-solid fa-right-to-bracket text-xs"></i>
          </button>
          <button onclick="openModal('userSettingsModal')" class="p-1.5 hover:bg-discord-hover hover:text-white rounded transition-colors" title="User Settings">
            <i class="fa-solid fa-gear text-xs"></i>
          </button>
        </div>
      </div>

    </aside>

    <!-- 3. CENTER CHAT & RIGHT MEMBER PANEL -->
    <div class="flex-1 flex flex-col min-w-0 bg-discord-chat">
      
      <!-- Top Channel Header -->
      <header class="h-12 border-b border-discord-black/40 px-4 flex items-center justify-between flex-shrink-0 shadow-sm">
        <div class="flex items-center space-x-2 min-w-0">
          <i id="channelHeaderIcon" class="fa-solid fa-hashtag text-discord-textMuted text-lg"></i>
          <span id="channelHeaderName" class="font-bold text-discord-textHeader truncate">general</span>
          <span class="text-discord-hover font-light hidden sm:inline">|</span>
          <span id="channelHeaderTopic" class="text-xs text-discord-textMuted truncate hidden sm:inline">Welcome to the server!</span>
        </div>

        <div class="flex items-center space-x-3 text-discord-textMuted">
          <!-- Pinned Messages Trigger -->
          <button onclick="openModal('pinnedModal')" class="hover:text-white text-sm" title="Pinned Messages">
            <i class="fa-solid fa-thumbtack"></i>
          </button>

          <!-- Toggle Member List Button -->
          <button onclick="toggleMemberList()" class="hover:text-white text-sm" title="Member List">
            <i class="fa-solid fa-users"></i>
          </button>

          <!-- Search Filter Box -->
          <div class="relative hidden md:block">
            <input type="text" id="searchInput" onkeyup="filterMessages()" placeholder="Search" class="bg-discord-black/80 text-xs text-discord-textHeader rounded px-2 py-1 pl-6 w-36 focus:w-48 transition-all duration-200 outline-none focus:ring-1 focus:ring-discord-blurple" />
            <i class="fa-solid fa-magnifying-glass text-[10px] absolute left-2 top-2 text-discord-textMuted"></i>
          </div>
        </div>
      </header>

      <!-- Main Workspace: Message Stream + Member Sidebar -->
      <div class="flex-1 flex min-h-0 relative">
        
        <!-- Messages Area -->
        <div class="flex-1 flex flex-col min-w-0">
          
          <!-- Message Feed List -->
          <div id="messagesContainer" class="flex-1 overflow-y-auto p-4 space-y-4">
            <!-- Messages rendered dynamically -->
          </div>

          <!-- Typing & Input Bar -->
          <div class="p-4 pt-0">
            <!-- Typing Indicator -->
            <div id="typingIndicator" class="h-4 text-[11px] text-discord-textMuted flex items-center space-x-1 mb-1">
              <!-- Populated dynamically -->
            </div>

            <!-- Rich Input Box -->
            <div class="bg-discord-input rounded-lg flex items-center px-4 py-2.5 shadow-inner">
              
              <!-- Attachment Button -->
              <button onclick="openModal('attachmentModal')" class="text-discord-textMuted hover:text-white mr-3 transition-colors" title="Attach Image URL">
                <i class="fa-solid fa-circle-plus text-base"></i>
              </button>

              <!-- Text Input Area -->
              <textarea id="messageInput" rows="1" oninput="autoGrowInput(this)" onkeydown="handleInputKeydown(event)" placeholder="Message #general" class="bg-transparent text-sm text-discord-textHeader placeholder-discord-textMuted flex-1 outline-none resize-none max-h-36 overflow-y-auto"></textarea>

              <!-- Emoji Reactions Picker Trigger -->
              <div class="relative ml-2">
                <button onclick="toggleEmojiPicker(event)" class="text-discord-textMuted hover:text-yellow-400 transition-colors" title="Emoji Picker">
                  <i class="fa-solid fa-face-smile text-lg"></i>
                </button>
                
                <!-- Emoji Quick Picker Popup -->
                <div id="emojiPickerPopup" class="hidden absolute right-0 bottom-8 bg-discord-black border border-discord-hover p-2 rounded-lg shadow-xl grid grid-cols-4 gap-2 z-50 text-xl">
                  <span onclick="insertEmoji('👍')" class="cursor-pointer hover:scale-125 transition-transform p-1">👍</span>
                  <span onclick="insertEmoji('❤️')" class="cursor-pointer hover:scale-125 transition-transform p-1">❤️</span>
                  <span onclick="insertEmoji('😂')" class="cursor-pointer hover:scale-125 transition-transform p-1">😂</span>
                  <span onclick="insertEmoji('🔥')" class="cursor-pointer hover:scale-125 transition-transform p-1">🔥</span>
                  <span onclick="insertEmoji('🚀')" class="cursor-pointer hover:scale-125 transition-transform p-1">🚀</span>
                  <span onclick="insertEmoji('🎉')" class="cursor-pointer hover:scale-125 transition-transform p-1">🎉</span>
                  <span onclick="insertEmoji('💩')" class="cursor-pointer hover:scale-125 transition-transform p-1">💩</span>
                  <span onclick="insertEmoji('👀')" class="cursor-pointer hover:scale-125 transition-transform p-1">👀</span>
                </div>
              </div>

              <!-- Send Button -->
              <button onclick="submitMessage()" class="ml-3 text-discord-blurple hover:text-white transition-colors" title="Send Message">
                <i class="fa-solid fa-paper-plane text-base"></i>
