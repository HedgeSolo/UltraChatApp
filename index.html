<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UltraChatApp 3000</title>

  <!-- Supabase JS Library v2 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    /* BASIC OLD-SCHOOL HTML/CSS AESTHETIC */
    * {
      box-sizing: border-box;
      font-family: Tahoma, Verdana, Arial, sans-serif;
    }

    body {
      background-color: #e5e5e5;
      color: #000;
      margin: 0;
      padding: 10px;
      font-size: 13px;
    }

    /* Container Box */
    #appContainer {
      max-width: 900px;
      margin: 0 auto;
      background: #ffffff;
      border: 2px solid #666;
      display: flex;
      flex-direction: column;
      height: 90vh;
      box-shadow: 2px 2px 5px rgba(0,0,0,0.2);
    }

    /* Top Header Bar */
    header {
      background: #2b4f81;
      color: #ffffff;
      padding: 8px 12px;
      border-bottom: 2px solid #112544;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      margin: 0;
      font-size: 16px;
      font-weight: bold;
    }

    .user-status-bar {
      font-size: 11px;
    }

    /* Main Workspace Layout (Sidebar + Chat) */
    .main-body {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* Sidebar - Server List & Joining */
    aside {
      width: 210px;
      background: #f0f0f0;
      border-right: 2px solid #ccc;
      padding: 10px;
      display: flex;
      flex-direction: flex;
      flex-direction: column;
      gap: 10px;
    }

    .sidebar-section {
      border: 1px solid #aaa;
      background: #fff;
      padding: 8px;
    }

    .sidebar-section h3 {
      margin: 0 0 6px 0;
      font-size: 12px;
      color: #333;
      border-bottom: 1px solid #ddd;
      padding-bottom: 3px;
    }

    .server-list {
      list-style: none;
      padding: 0;
      margin: 0;
      max-height: 200px;
      overflow-y: auto;
    }

    .server-item {
      padding: 5px 8px;
      margin-bottom: 3px;
      background: #e8e8e8;
      border: 1px solid #bbb;
      cursor: pointer;
      font-weight: bold;
    }

    .server-item.active {
      background: #2b4f81;
      color: #fff;
      border-color: #112544;
    }

    /* Main Chat Area */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #fff;
    }

    .chat-header {
      background: #e9edf4;
      border-bottom: 1px solid #bbb;
      padding: 8px 12px;
      font-weight: bold;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .chat-messages {
      flex: 1;
      padding: 12px;
      overflow-y: auto;
      background: #fafafa;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .msg-row {
      border-bottom: 1px solid #eee;
      padding-bottom: 5px;
      word-break: break-word;
    }

    .msg-header {
      font-size: 11px;
      color: #555;
      margin-bottom: 2px;
    }

    .msg-author {
      font-weight: bold;
      color: #2b4f81;
    }

    .msg-text {
      font-size: 13px;
      color: #111;
    }

    /* @Mentions Styling */
    .mention {
      background: #fff3cd;
      color: #856404;
      padding: 1px 4px;
      border: 1px solid #ffeeba;
      border-radius: 2px;
      font-weight: bold;
    }

    .mention-me {
      background: #ff3333;
      color: #ffffff;
      border: 1px solid #cc0000;
    }

    /* Message Input Box */
    .chat-input-area {
      padding: 10px;
      border-top: 2px solid #ccc;
      background: #f0f0f0;
      display: flex;
      gap: 8px;
    }

    .chat-input-area textarea {
      flex: 1;
      height: 40px;
      border: 1px solid #888;
      padding: 6px;
      font-size: 12px;
      resize: none;
    }

    /* Basic HTML Form Controls */
    input[type="text"], input[type="email"], input[type="password"] {
      width: 100%;
      padding: 5px;
      border: 1px solid #777;
      font-size: 12px;
      margin-bottom: 6px;
    }

    button {
      background: #e1e1e1;
      border: 1px solid #777;
      padding: 5px 10px;
      font-size: 12px;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background: #d0d0d0;
    }

    button.primary {
      background: #2b4f81;
      color: white;
      border-color: #112544;
    }

    button.primary:hover {
      background: #1e3a63;
    }

    /* Authentication Modal Overlay */
    .auth-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .auth-box {
      background: #fff;
      border: 2px solid #2b4f81;
      padding: 20px;
      width: 320px;
      box-shadow: 4px 4px 10px rgba(0,0,0,0.3);
    }

    .auth-box h2 {
      margin-top: 0;
      font-size: 16px;
      color: #2b4f81;
      border-bottom: 2px solid #2b4f81;
      padding-bottom: 5px;
    }

    .hidden {
      display: none !important;
    }

    .error-text {
      color: #c00;
      font-size: 11px;
      margin-top: 4px;
    }
  </style>
</head>
<body>

  <!-- MAIN APP CONTAINER -->
  <div id="appContainer">
    
    <!-- HEADER -->
    <header>
      <h1>UltraChatApp 3000</h1>
      <div class="user-status-bar">
        <span id="userStatusText">Not Logged In</span>
        <button id="authBtn" onclick="openAuthModal()" style="margin-left:8px;">Log In / Register</button>
      </div>
    </header>

    <!-- MAIN WORKSPACE -->
    <div class="main-body">

      <!-- SIDEBAR: SERVERS -->
      <aside>
        <div class="sidebar-section">
          <h3>My Servers</h3>
          <ul id="serverList" class="server-list">
            <!-- Dynamically populated servers -->
          </ul>
        </div>

        <div class="sidebar-section">
          <h3>Join / Create Server</h3>
          <input type="text" id="serverInput" placeholder="Server ID (e.g. tech-lounge)" />
          <button onclick="joinServerFromInput()" class="primary" style="width:100%;">Join / Create</button>
        </div>
      </aside>

      <!-- MAIN CHAT PANEL -->
      <main>
        <div class="chat-header">
          <span id="currentServerTitle">Select or Join a Server</span>
          <span id="realtimeIndicator" style="font-size: 10px; color: #888;">● Offline</span>
        </div>

        <div id="chatMessages" class="chat-messages">
          <div style="text-align:center; color:#777; margin-top:20px;">
            Please log in and join a server to view and send messages.
          </div>
        </div>

        <!-- INPUT AREA (DISABLED IF GUEST) -->
        <div class="chat-input-area">
          <textarea id="messageTextarea" placeholder="Type a message... Use @username to tag people." disabled></textarea>
          <button id="sendBtn" onclick="sendMessage()" class="primary" disabled>Send</button>
        </div>
      </main>

    </div>
  </div>

  <!-- AUTHENTICATION MODAL (STRICT ACCOUNT REQUIREMENT) -->
  <div id="authModal" class="auth-overlay">
    <div class="auth-box">
      <h2>Account Sign In / Register</h2>
      <p style="font-size:11px; color:#555;">You must be logged in with a real account to post messages.</p>

      <label style="font-size:11px; font-weight:bold;">Email:</label>
      <input type="email" id="authEmail" placeholder="yourname@domain.com" />

      <label style="font-size:11px; font-weight:bold;">Password:</label>
      <input type="password" id="authPassword" placeholder="••••••••" />

      <label style="font-size:11px; font-weight:bold;">Username / Screen Name:</label>
      <input type="text" id="authUsername" placeholder="e.g. Alex99" />

      <div style="display:flex; gap:6px; margin-top:10px;">
        <button onclick="handleSignIn()" class="primary" style="flex:1;">Log In</button>
        <button onclick="handleSignUp()" style="flex:1;">Register</button>
      </div>

      <div id="authError" class="error-text"></div>
    </div>
  </div>

  <!-- SCRIPT LOGIC -->
  <script>
    /* ----------------------------------------------------------------------
       1. SUPABASE INITIALIZATION
       ---------------------------------------------------------------------- */
    const SUPABASE_URL = "https://unjvzzlwxpmiqyrovbce.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVuanZ6emx3eHBtaXF5cm92YmNlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMyODE1MDAsImV4cCI6MjEwODg1NzUwMH0.WKKvm2xkIJf8nJLy8eV4ndQZ7LF1qp5ExHGX6LL3a_A";

    const { createClient } = supabase;
    const client = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    /* ----------------------------------------------------------------------
       2. APP STATE
       ---------------------------------------------------------------------- */
    let currentUser = null; // { id, email, name }
    let joinedServers = JSON.parse(localStorage.getItem('ultrachat_servers') || '[]');
    let activeServerId = null;
    let realtimeChannel = null;

    /* ----------------------------------------------------------------------
       3. INITIALIZATION & AUTH LISTENERS
       ---------------------------------------------------------------------- */
    window.addEventListener('DOMContentLoaded', async () => {
      // Check auth session
      const { data: { session } } = await client.auth.getSession();
      if (session && session.user) {
        setLoggedInUser(session.user);
      } else {
        openAuthModal();
      }

      renderServerList();

      // Keyboard enter key to send message
      document.getElementById('messageTextarea').addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          sendMessage();
        }
      });
    });

    function setLoggedInUser(user) {
      const username = user.user_metadata?.username || user.email.split('@')[0];
      currentUser = {
        id: user.id,
        email: user.email,
        name: username
      };

      document.getElementById('userStatusText').innerText = `Logged in as: ${currentUser.name}`;
      document.getElementById('authBtn').innerText = 'Log Out';
      document.getElementById('authBtn').onclick = handleSignOut;

      // Enable messaging inputs
      document.getElementById('messageTextarea').disabled = false;
      document.getElementById('sendBtn').disabled = false;

      closeAuthModal();

      // If user has saved servers, auto-join the first
      if (joinedServers.length > 0 && !activeServerId) {
        selectServer(joinedServers[0]);
      }
    }

    /* ----------------------------------------------------------------------
       4. AUTHENTICATION HANDLERS
       ---------------------------------------------------------------------- */
    async function handleSignIn() {
      const email = document.getElementById('authEmail').value.trim();
      const password = document.getElementById('authPassword').value.trim();
      const errorEl = document.getElementById('authError');
      errorEl.innerText = '';

      if (!email || !password) {
        errorEl.innerText = 'Please enter both email and password.';
        return;
      }

      const { data, error } = await client.auth.signInWithPassword({ email, password });
      if (error) {
        errorEl.innerText = error.message;
      } else if (data.user) {
        setLoggedInUser(data.user);
      }
    }

    async function handleSignUp() {
      const email = document.getElementById('authEmail').value.trim();
      const password = document.getElementById('authPassword').value.trim();
      const username = document.getElementById('authUsername').value.trim() || email.split('@')[0];
      const errorEl = document.getElementById('authError');
      errorEl.innerText = '';

      if (!email || !password) {
        errorEl.innerText = 'Please enter email and password.';
        return;
      }

      const { data, error } = await client.auth.signUp({
        email,
        password,
        options: { data: { username: username } }
      });

      if (error) {
        errorEl.innerText = error.message;
      } else if (data.user) {
        setLoggedInUser(data.user);
      }
    }

    async function handleSignOut() {
      await client.auth.signOut();
      currentUser = null;
      document.getElementById('userStatusText').innerText = 'Not Logged In';
      document.getElementById('authBtn').innerText = 'Log In / Register';
      document.getElementById('authBtn').onclick = openAuthModal;

      document.getElementById('messageTextarea').disabled = true;
      document.getElementById('sendBtn').disabled = true;

      openAuthModal();
    }

    function openAuthModal() {
      document.getElementById('authModal').classList.remove('hidden');
    }

    function closeAuthModal() {
      document.getElementById('authError').innerText = '';
      document.getElementById('authModal').classList.add('hidden');
    }

    /* ----------------------------------------------------------------------
       5. SERVER MANAGEMENT (NO PRE-MADE PLACEHOLDERS)
       ---------------------------------------------------------------------- */
    function joinServerFromInput() {
      const input = document.getElementById('serverInput');
      const serverId = input.value.trim().toLowerCase().replace(/[^a-z0-9_-]/g, '');
      
      if (!serverId) return;

      if (!joinedServers.includes(serverId)) {
        joinedServers.push(serverId);
        localStorage.setItem('ultrachat_servers', JSON.stringify(joinedServers));
        renderServerList();
      }

      input.value = '';
      selectServer(serverId);
    }

    function renderServerList() {
      const listEl = document.getElementById('serverList');
      if (joinedServers.length === 0) {
        listEl.innerHTML = '<li style="font-size:11px; color:#777;">No servers joined. Type a server ID below to create or join one!</li>';
        return;
      }

      listEl.innerHTML = joinedServers.map(s => `
        <li class="server-item ${s === activeServerId ? 'active' : ''}" onclick="selectServer('${s}')">
          # ${s}
        </li>
      `).join('');
    }

    function selectServer(serverId) {
      activeServerId = serverId;
      document.getElementById('currentServerTitle').innerText = `Server: #${serverId}`;
      renderServerList();

      fetchMessages();
      subscribeToRealtime();
    }

    /* ----------------------------------------------------------------------
       6. REAL-TIME AUTO-UPDATES (SUPABASE SUBSCRIPTION)
       ---------------------------------------------------------------------- */
    async function fetchMessages() {
      if (!activeServerId) return;

      const container = document.getElementById('chatMessages');
      container.innerHTML = '<div style="color:#777; text-align:center;">Loading messages...</div>';

      const { data, error } = await client
        .from('messages')
        .select('*')
        .eq('server_id', activeServerId)
        .order('created_at', { ascending: true })
        .limit(100);

      if (error) {
        container.innerHTML = `<div class="error-text">Failed to load messages: ${error.message}</div>`;
        return;
      }

      container.innerHTML = '';
      if (!data || data.length === 0) {
        container.innerHTML = '<div style="color:#777; text-align:center; margin-top:20px;">No messages in this server yet. Write the first message below!</div>';
        return;
      }

      data.forEach(msg => appendMessage(msg, false));
      container.scrollTop = container.scrollHeight;
    }

    function subscribeToRealtime() {
      if (!activeServerId) return;

      if (realtimeChannel) {
        client.removeChannel(realtimeChannel);
      }

      const indicator = document.getElementById('realtimeIndicator');

      realtimeChannel = client.channel(`public:messages:${activeServerId}`)
        .on('postgres_changes', { 
          event: 'INSERT', 
          schema: 'public', 
          table: 'messages',
          filter: `server_id=eq.${activeServerId}`
        }, payload => {
          const newMsg = payload.new;
          appendMessage(newMsg, true);
          checkAndPlayMentionSound(newMsg);
        })
        .subscribe((status) => {
          if (status === 'SUBSCRIBED') {
            indicator.innerText = '● Live Auto-Updating';
            indicator.style.color = 'green';
          } else {
            indicator.innerText = '● Connecting...';
            indicator.style.color = '#888';
          }
        });
    }

    /* ----------------------------------------------------------------------
       7. SEND MESSAGE & MENTIONS SYSTEM
       ---------------------------------------------------------------------- */
    async function sendMessage() {
      if (!currentUser) {
        alert('You must log in to send messages.');
        openAuthModal();
        return;
      }

      if (!activeServerId) {
        alert('Please create or select a server first.');
        return;
      }

      const textarea = document.getElementById('messageTextarea');
      const text = textarea.value.trim();
      if (!text) return;

      textarea.value = '';

      const payload = {
        text: text,
        user_name: currentUser.name,
        server_id: activeServerId,
        channel_id: 'general',
        room: activeServerId
      };

      const { error } = await client.from('messages').insert([payload]);

      if (error) {
        alert('Error sending message: ' + error.message);
      }
    }

    function appendMessage(msg, autoScroll = true) {
      const container = document.getElementById('chatMessages');

      // Clear empty state text
      if (container.querySelector('div')?.innerText.includes('No messages') || 
          container.querySelector('div')?.innerText.includes('Loading messages')) {
        container.innerHTML = '';
      }

      const dateStr = msg.created_at ? new Date(msg.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';
      const formattedText = parseMentions(msg.text || '');

      const msgDiv = document.createElement('div');
      msgDiv.className = 'msg-row';
      msgDiv.innerHTML = `
        <div class="msg-header">
          <span class="msg-author">${escapeHtml(msg.user_name || 'Anonymous')}</span>
          <span style="font-size:10px; color:#888; margin-left:6px;">${dateStr}</span>
        </div>
        <div class="msg-text">${formattedText}</div>
      `;

      container.appendChild(msgDiv);

      if (autoScroll) {
        container.scrollTop = container.scrollHeight;
      }
    }

    /* Parses @username mentions */
    function parseMentions(text) {
      const escaped = escapeHtml(text);
      return escaped.replace(/@([a-zA-Z0-9_\-]+)/g, (match, uname) => {
        const isMe = currentUser && uname.toLowerCase() === currentUser.name.toLowerCase();
        return `<span class="mention ${isMe ? 'mention-me' : ''}">@${uname}</span>`;
      });
    }

    /* Plays chime sound if logged-in user is tagged in @mention */
    function checkAndPlayMentionSound(msg) {
      if (!currentUser) return;

      const mentionTag = `@${currentUser.name.toLowerCase()}`;
      if (msg.text && msg.text.toLowerCase().includes(mentionTag) && msg.user_name !== currentUser.name) {
        playChime();
      }
    }

    function playChime() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, ctx.currentTime);
        osc.frequency.setValueAtTime(1320, ctx.currentTime + 0.1);

        gain.gain.setValueAtTime(0.2, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.start();
        osc.stop(ctx.currentTime + 0.3);
      } catch (e) {
        // Audio playback error fallback
      }
    }

    function escapeHtml(str) {
      return str ? str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;") : '';
    }
  </script>
</body>
</html>
